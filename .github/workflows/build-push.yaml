name: Build and Push Obico ML Image

on:
  push:
    branches:
      - main
  workflow_dispatch: # Tillater at du kan klikke "Run workflow" manuelt fra GitHub UI

env:
  REGISTRY: ghcr.io
  # Dette genererer automatisk navnet: ghcr.io/ditt-brukernavn/ha-elegoo-spaghetti-detection-ml
  IMAGE_NAME: ${{ github.repository_owner }}/ha-elegoo-spaghetti-detection-ml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Gir GitHub Action lov til å pushe til ditt GHCR-register

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logg inn på GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Innebygd token, krever ingen oppsett!

      - name: Generer Docker metadata (tags og labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

          # Bygg og push Docker-image til GHCR
      - name: Bygg og push Docker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Aktiverer lagring av lag for lynraske påfølgende bygg
          cache-from: type=gha
          cache-to: type=gha,mode=max
